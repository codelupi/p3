<!doctype html>
<html>
<head>
	<title>PS3 Exploit Menu</title>
	<meta content="width=device-width, initial-scale=1" name="viewport" />
	<style type="text/css">
body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background-color: #050b14;
    overflow-x: hidden;
    position: relative;
}

/* Animación de luces suaves de fondo */
.background-lights {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
}

.light-1 {
    position: absolute;
    top: -20%;
    left: -10%;
    width: 60vw;
    height: 60vw;
    background: radial-gradient(circle, rgba(0, 150, 255, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
    border-radius: 50%;
    animation: moveLight1 18s ease-in-out infinite alternate;
}

.light-2 {
    position: absolute;
    bottom: -20%;
    right: -10%;
    width: 65vw;
    height: 65vw;
    background: radial-gradient(circle, rgba(0, 230, 200, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
    border-radius: 50%;
    animation: moveLight2 22s ease-in-out infinite alternate;
}

.light-3 {
    position: absolute;
    top: 30%;
    left: 30%;
    width: 45vw;
    height: 45vw;
    background: radial-gradient(circle, rgba(30, 80, 220, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
    border-radius: 50%;
    animation: moveLight3 15s ease-in-out infinite alternate;
}

@keyframes moveLight1 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(15vw, 10vh) scale(1.2); }
    100% { transform: translate(5vw, 20vh) scale(0.9); }
}

@keyframes moveLight2 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-12vw, -15vh) scale(1.15); }
    100% { transform: translate(-20vw, -5vh) scale(0.95); }
}

@keyframes moveLight3 {
    0% { transform: translate(0, 0) scale(0.9); opacity: 0.6; }
    50% { transform: translate(-10vw, 10vh) scale(1.3); opacity: 0.9; }
    100% { transform: translate(10vw, -10vh) scale(1); opacity: 0.6; }
}

/* Header con Logo a la izquierda */
.header {
    padding: 20px 0 0 30px;
    display: flex;
    align-items: center;
}
.header img.logo {
    max-height: 80px;
    width: auto;
}

/* Contenedor principal centrado */
.container {
    margin: 20px auto;
    width: 95%;
    display: flex;
    justify-content: center;
}

/* general styles */
.menu, .menu ul {
    list-style: none;
    padding: 0;
    margin: 0;
}
.menu {
    height: 58px;
    display: flex;
    justify-content: center;
}
.menu li {
    background: linear-gradient(#1a2636, #0e1724);
    border-bottom: 2px solid #a8d93f;
    border-top: 2px solid #a8d93f;
    min-width: 160px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
}
.menu > li {
    display: block;
    position: relative;
}
.menu > li:first-child {
    border-radius: 5px 0 0;
}
.menu a {
    border-left: 1px solid rgba(0, 0, 0, 0);
    color: #ffffff;
    display: block;
    font-family: 'Lucida Console', monospace;
    font-size: 18px;
    line-height: 54px;
    padding: 0 25px;
    text-decoration: none;
    text-transform: uppercase;
    text-align: center;
}

/* onhover styles */
.menu li:hover {
    background: linear-gradient(#24354a, #152233);
    border-bottom: 2px solid #222222;
    border-top: 2px solid #1B1B1B;
}
.menu li:hover > a {
    border-radius: 5px 0 0 0;
    border-left: 3px solid #C4302B;
    color: #C4302B;
}

/* submenu styles */
.submenu {
    left: 0;
    max-height: 0;
    position: absolute;
    top: 100%;
    z-index: 0;
    width: 100%;

    -webkit-perspective: 400px;
    -moz-perspective: 400px;
    -ms-perspective: 400px;
    -o-perspective: 400px;
    perspective: 400px;
}
.submenu li {
    opacity: 0;

    -webkit-transform: rotateY(90deg);
    -moz-transform: rotateY(90deg);
    -ms-transform: rotateY(90deg);
    -o-transform: rotateY(90deg);
    transform: rotateY(90deg);

    -webkit-transition: opacity .4s, -webkit-transform .5s;
    -moz-transition: opacity .4s, -moz-transform .5s;
    -ms-transition: opacity .4s, -ms-transform .5s;
    -o-transition: opacity .4s, -o-transform .5s;
    transition: opacity .4s, transform .5s;
}
.menu .submenu li:hover a {
    border-left: 3px solid #0096ff;
    border-radius: 0;
    color: #ffffff;
}
.menu > li:hover .submenu, .menu > li:focus .submenu {
    max-height: 2000px;
    z-index: 10;
}
.menu > li:hover .submenu li, .menu > li:focus .submenu li {
    opacity: 1;

    -webkit-transform: none;
    -moz-transform: none;
    -ms-transform: none;
    -o-transform: none;
    transform: none;
}

/* CSS3 delays for transition effects */
.menu li:hover .submenu li:nth-child(1) { transition-delay: 0ms; }
.menu li:hover .submenu li:nth-child(2) { transition-delay: 50ms; }
.menu li:hover .submenu li:nth-child(3) { transition-delay: 100ms; }
.menu li:hover .submenu li:nth-child(4) { transition-delay: 150ms; }
.menu li:hover .submenu li:nth-child(5) { transition-delay: 200ms; }
.menu li:hover .submenu li:nth-child(6) { transition-delay: 250ms; }
.menu li:hover .submenu li:nth-child(7) { transition-delay: 300ms; }
.menu li:hover .submenu li:nth-child(8) { transition-delay: 350ms; }
.menu li:hover .submenu li:nth-child(9) { transition-delay: 400ms; }
      
.submenu li:nth-child(1) { transition-delay: 400ms; }
.submenu li:nth-child(2) { transition-delay: 350ms; }
.submenu li:nth-child(3) { transition-delay: 300ms; }
.submenu li:nth-child(4) { transition-delay: 250ms; }
.submenu li:nth-child(5) { transition-delay: 200ms; }
.submenu li:nth-child(6) { transition-delay: 150ms; }
.submenu li:nth-child(7) { transition-delay: 100ms; }
.submenu li:nth-child(8) { transition-delay: 50ms; }
.submenu li:nth-child(9) { transition-delay: 0ms; }

/* Estilos del Footer */
.footer {
    text-align: center;
    padding: 15px;
    font-family: 'Lucida Console', monospace;
    font-size: 16px;
    color: #a0c0e0;
    background: rgba(5, 11, 20, 0.85);
    border-top: 1px solid rgba(168, 217, 63, 0.4);
    box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.5);
}
